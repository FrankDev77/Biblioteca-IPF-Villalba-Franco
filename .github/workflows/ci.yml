name: CI

on: [push, pull_request]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # legacy-peer-deps por el mismo conflicto de react-dom que se explica en el README
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
